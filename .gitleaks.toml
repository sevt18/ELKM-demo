[extend]
useDefault = true

[[rules]]
id = "aws-access-key-id"
description = "Detected AWS Access Key ID"
regex = '''\b(AKIA[A-Z0-9]{16})\b'''
keywords = ["akia", "AKIA"]

[[rules]]
id = "aws-secret-access-key"
description = "Detected AWS Secret Access Key"
regex = '''(?i)(aws_secret_access_key|aws_secret|secret_key)[\s:=]+([a-zA-Z0-9/+=]{40})'''
keywords = ["aws_secret_access_key", "secret_access_key"]

[allowlist]
description = "Allowlist Firebase Web Client Configuration (public web identifiers)"
paths = [
  '''firebase-applet-config\.json''',
]
